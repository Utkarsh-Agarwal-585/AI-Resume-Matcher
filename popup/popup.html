<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <header class="app-header">
            <div class="app-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                AI Resume Matcher
            </div>
        </header>

        <div class="section-card">
            <label for="resumeInput">Resume</label>
            <div id="dropZone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                <span id="dropLabel">Drop PDF or .txt here</span>
            </div>
            <textarea id="resumeInput" placeholder="…or paste resume text here"></textarea>
            <button id="saveResume" class="btn-secondary">Save Resume</button>
            <div id="resumeStatus" class="field-status"></div>
        </div>

        <div class="section-card">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIza…" autocomplete="off" />
            <button id="saveKey" class="btn-secondary">Save API Key</button>
            <div id="keyStatus" class="field-status"></div>
        </div>

        <button id="analyze" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Analyze Job
        </button>

        <div id="statusBar" class="status-bar hidden">
            <div class="spinner"></div>
            <span id="statusText"></span>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <!-- Analysis Result Card -->
        <div id="resultCard" class="result-card hidden">
            <div class="score-section">
                <div id="scoreCircle" class="score-circle">
                    <span id="scoreValue" class="score-value">--</span>
                    <span class="score-max">/100</span>
                </div>
                <div class="score-meta">
                    <div id="scoreLabel" class="score-label-text">Analyzing…</div>
                    <div id="scoreSummary" class="score-summary"></div>
                </div>
            </div>

            <div id="strongMatchesSection" class="result-section">
                <div class="result-section-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Strong Matches
                </div>
                <div id="strongMatchesTags" class="tags-row"></div>
            </div>

            <div id="missingKeywordsSection" class="result-section">
                <div class="result-section-title missing">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Missing Keywords
                </div>
                <div id="missingKeywordsTags" class="tags-row"></div>
            </div>

            <div id="improvementsSection" class="result-section">
                <div class="result-section-title warning">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    Top Improvements
                </div>
                <ul id="improvementsList" class="improvements-list"></ul>
            </div>

            <!-- Score improvement banner (shown after rewrite + re-analysis) -->
            <div id="scoreImprovement" class="score-improvement hidden">
                <div class="si-label">Score after rewrite</div>
                <div class="si-scores">
                    <div class="si-before">
                        <span class="si-num" id="siBefore">--</span>
                        <span class="si-sub">before</span>
                    </div>
                    <svg class="si-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    <div class="si-after">
                        <span class="si-num" id="siAfter">--</span>
                        <span class="si-sub">after</span>
                    </div>
                    <span id="siDelta" class="si-delta"></span>
                </div>
                <div id="siNewMissing" class="si-new-missing"></div>
            </div>

            <div class="divider"></div>

            <!-- Format picker -->
            <div class="format-picker">
                <span class="fp-label">Download as</span>
                <div class="fp-options">
                    <button class="fp-btn" data-fmt="txt">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        TXT
                    </button>
                    <button class="fp-btn active" data-fmt="pdf">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        PDF Preview
                    </button>
                    <button class="fp-btn" data-fmt="doc">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        Word (.doc)
                    </button>
                </div>
            </div>

            <button id="rewriteBtn" class="btn-rewrite">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Rewrite My Resume
            </button>
            <p class="rewrite-hint" id="rewriteHint">Opens a formatted, print-ready resume in a new tab.</p>
        </div>

        <script type="module" src="popup.js"></script>
    </body>
</html>
