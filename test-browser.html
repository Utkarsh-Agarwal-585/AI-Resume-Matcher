<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Matcher — Local Test</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #0f3460;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 32px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 28px;
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            border: 1.5px solid #dde1ea;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
            background: #fafbfc;
        }

        input:focus, textarea:focus {
            border-color: #4361ee;
            background: #fff;
        }

        textarea { min-height: 130px; }

        .row { display: flex; gap: 16px; }
        .row > div { flex: 1; }

        button {
            padding: 12px 28px;
            background: #4361ee;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            align-self: flex-start;
        }

        button:hover  { background: #3451d1; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #a0aec0; cursor: not-allowed; }

        #status {
            font-size: 0.85rem;
            color: #718096;
            min-height: 20px;
        }

        #status.error { color: #e53e3e; }
        #status.success { color: #38a169; }

        .results { display: none; flex-direction: column; gap: 16px; }

        .result-section {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .result-section h3 {
            background: #eef2ff;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #3451d1;
            border-bottom: 1.5px solid #e2e8f0;
        }

        .result-section pre {
            padding: 14px 16px;
            font-size: 0.82rem;
            font-family: "SF Mono", "Fira Code", monospace;
            white-space: pre-wrap;
            word-break: break-word;
            background: #fff;
            color: #2d3748;
            max-height: 280px;
            overflow-y: auto;
        }

        .score-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1rem;
            margin-left: 10px;
            vertical-align: middle;
        }

        .badge-green  { background: #c6f6d5; color: #276749; }
        .badge-yellow { background: #fefcbf; color: #744210; }
        .badge-red    { background: #fed7d7; color: #9b2c2c; }

        .drop-zone {
            border: 2px dashed #bbc3d4;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            cursor: default;
            margin-bottom: 8px;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone.drag-over {
            border-color: #4361ee;
            background: #eef2ff;
            color: #3451d1;
        }
        .drop-zone .drop-hint { font-size: 0.75rem; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>

<h1>AI Resume Matcher</h1>
<p class="subtitle">Local test page — works in Safari, Firefox, or any browser. No extension needed.</p>

<div class="card">
    <div>
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
    </div>

    <div class="row">
        <div>
            <label>Resume (PDF or text)</label>
            <div class="drop-zone" id="resumeDrop">
                <div id="resumeDropLabel">Drop your resume PDF or .txt here</div>
                <div class="drop-hint">or paste text in the box below</div>
            </div>
            <textarea id="resumeText" placeholder="Paste your resume here…"></textarea>
        </div>
        <div>
            <label>Job Description</label>
            <textarea id="jdText" placeholder="Paste the job description here…"></textarea>
        </div>
    </div>

    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <button id="analyzeBtn">Analyze</button>
        <span id="status"></span>
    </div>

    <div class="results" id="results">
        <div class="result-section" id="scoreSection">
            <h3 id="scoreHeading">Score</h3>
            <pre id="scoreOut"></pre>
        </div>
        <div class="result-section">
            <h3>Analysis</h3>
            <pre id="analysisOut"></pre>
        </div>
        <div class="result-section">
            <h3>Suggested Rewrite</h3>
            <pre id="rewriteOut"></pre>
        </div>
    </div>
</div>

<script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    // ── PDF extraction ────────────────────────────────────────────────────────
    async function extractPDF(file) {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const pages = await Promise.all(
            Array.from({ length: pdf.numPages }, (_, i) =>
                pdf.getPage(i + 1)
                    .then(p => p.getTextContent())
                    .then(tc => tc.items.map(it => it.str).join(" "))
            )
        );
        return pages.join("\n");
    }

    // ── Resume drag-and-drop ──────────────────────────────────────────────────
    const resumeDrop  = document.getElementById("resumeDrop");
    const resumeLabel = document.getElementById("resumeDropLabel");

    resumeDrop.addEventListener("dragover", (e) => {
        e.preventDefault();
        resumeDrop.classList.add("drag-over");
    });
    resumeDrop.addEventListener("dragleave", () => resumeDrop.classList.remove("drag-over"));
    resumeDrop.addEventListener("drop", async (e) => {
        e.preventDefault();
        resumeDrop.classList.remove("drag-over");
        const file = e.dataTransfer.files[0];
        if (!file) return;
        resumeLabel.textContent = "Reading…";
        try {
            const text = (file.type === "application/pdf" || file.name.endsWith(".pdf"))
                ? await extractPDF(file)
                : await file.text();
            document.getElementById("resumeText").value = text;
            resumeLabel.textContent = `✓ Loaded: ${file.name}`;
        } catch (err) {
            resumeLabel.textContent = "Drop your resume PDF or .txt here";
            setStatus("Error reading file: " + err.message, "error");
        }
    });

    // ── Inline copies of utils & services (no chrome.* APIs) ──────────────────

    function preprocessText(text, limit = 10000) {
        return text.replace(/\s+/g, " ").trim().slice(0, limit);
    }

    function safeParse(text) {
        if (!text) return null;
        try { return JSON.parse(text); } catch {}
        try {
            const fenced = text
                .replace(/^[\s\S]*?```(?:json)?\s*/i, "")
                .replace(/\s*```[\s\S]*$/, "")
                .trim();
            return JSON.parse(fenced);
        } catch {}
        try {
            const match = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
            if (match) return JSON.parse(match[1]);
        } catch {}
        return null;
    }

    const GEMINI_MODEL   = "gemini-2.5-flash";
    const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const MAX_RETRIES    = 3;

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function parseRetryAfterMs(msg) {
        const m = msg.match(/retry in ([\d.]+)s/i);
        return m ? Math.ceil(parseFloat(m[1]) * 1000) + 2000 : null;
    }

    async function callGemini(apiKey, prompt, onWaiting) {
        for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
            const res = await fetch(`${GEMINI_API_URL}?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.2,
                        topP: 0.8,
                        responseMimeType: "application/json",
                    },
                }),
            });

            if (res.status === 429) {
                const errBody = await res.json().catch(() => ({}));
                const errMsg  = errBody?.error?.message || "";
                if (attempt === MAX_RETRIES) throw new Error(`Rate limit hit after ${MAX_RETRIES} retries. ${errMsg}`);
                const waitMs  = parseRetryAfterMs(errMsg) ?? (2 ** attempt) * 8000;
                const waitSec = Math.ceil(waitMs / 1000);
                onWaiting?.(`Rate limited — waiting ${waitSec}s (retry ${attempt + 1}/${MAX_RETRIES})…`);
                await sleep(waitMs);
                continue;
            }

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`Gemini API ${res.status}: ${err?.error?.message || res.statusText}`);
            }

            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }
    }

    async function runPipeline(apiKey, resume, jd, onStatus) {
        onStatus?.("Step 1/3 — Analysing resume…");
        const analysisPrompt = `You are a resume analyst. Return ONLY a raw JSON object — no markdown, no explanation.
Schema: { "missingKeywords": string[], "strongMatches": string[], "score": integer (0-100), "topImprovements": string[] }
Resume: ${resume}
Job Description: ${jd}`;

        const analysisResponse = await callGemini(apiKey, analysisPrompt, onStatus);
        const analysis = safeParse(analysisResponse);
        if (!analysis) throw new Error("Failed to parse analysis response.");

        await sleep(2000);

        onStatus?.("Step 2/3 — Rewriting resume…");
        const rewritePrompt = `You are a resume writer. Rewrite the resume to better match the job description using ONLY information already present in the resume. Return ONLY a raw JSON object — no markdown, no explanation.
Schema: { "summary": string, "experience": string[], "projects": string[], "skills": string[] }
Resume: ${resume}
Job Description: ${jd}`;

        const rewriteResponse = await callGemini(apiKey, rewritePrompt, onStatus);
        const rewrite = safeParse(rewriteResponse);
        if (!rewrite) throw new Error("Failed to parse rewrite response.");

        await sleep(2000);

        onStatus?.("Step 3/3 — Scoring…");
        const scorePrompt = `You are a hiring evaluator. Score the rewritten resume against the job description. Return ONLY a raw JSON object — no markdown, no explanation.
Schema: { "score": integer (0-100), "improvements": string[] }
Rewritten Resume: ${JSON.stringify(rewrite)}
Job Description: ${jd}`;

        const scoreResponse = await callGemini(apiKey, scorePrompt, onStatus);
        const score = safeParse(scoreResponse);
        if (!score) throw new Error("Failed to parse score response.");

        return { analysis, rewrite, score };
    }

    // ── UI logic ───────────────────────────────────────────────────────────────

    const btn     = document.getElementById("analyzeBtn");
    const status  = document.getElementById("status");
    const results = document.getElementById("results");

    function setStatus(msg, type = "") {
        status.textContent = msg;
        status.className = type;
    }

    function animateSteps() {
        // steps are now driven by onStatus callbacks — nothing to animate here
    }

    function badgeClass(score) {
        if (score >= 75) return "badge-green";
        if (score >= 50) return "badge-yellow";
        return "badge-red";
    }

    btn.addEventListener("click", async () => {
        const apiKey     = document.getElementById("apiKey").value.trim();
        const resumeRaw  = document.getElementById("resumeText").value.trim();
        const jdRaw      = document.getElementById("jdText").value.trim();

        if (!apiKey)    return setStatus("Please enter your Gemini API key.", "error");
        if (!resumeRaw) return setStatus("Please paste your resume text.", "error");
        if (!jdRaw)     return setStatus("Please paste the job description.", "error");

        btn.disabled = true;
        results.style.display = "none";
        setStatus("Starting…");

        try {
            const resume = preprocessText(resumeRaw);
            const jd     = preprocessText(jdRaw);
            const output = await runPipeline(apiKey, resume, jd, (msg) => setStatus(msg));

            const finalScore = output.score?.score ?? output.analysis?.score ?? "—";
            const badge = `<span class="score-badge ${badgeClass(finalScore)}">${finalScore}/100</span>`;
            document.getElementById("scoreHeading").innerHTML = "Score " + badge;
            document.getElementById("scoreOut").textContent =
                JSON.stringify(output.score, null, 2);
            document.getElementById("analysisOut").textContent =
                JSON.stringify(output.analysis, null, 2);
            document.getElementById("rewriteOut").textContent =
                JSON.stringify(output.rewrite, null, 2);

            results.style.display = "flex";
            setStatus("Done!", "success");
        } catch (err) {
            setStatus("Error: " + err.message, "error");
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
